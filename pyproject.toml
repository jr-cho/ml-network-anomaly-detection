[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dosdetect"
version = "0.1.0"
description = "DoS detection on NSL-KDD: reproduction of Tundis & Cauteruccio (DCOSS-IoT 2025), extended with tree-based models."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Joshua Gottus" }, { name = "Ethan Barron" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0", "nbconvert>=7", "ipykernel>=6"]
dev = ["pytest>=8", "ruff>=0.6", "nbformat>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E501"]  # line length is handled by `ruff format`

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
